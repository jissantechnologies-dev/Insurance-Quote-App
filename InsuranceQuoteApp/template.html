<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gravity Insurance</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <div class="page-shell">
    <header class="hero">
        <p class="eyebrow">Insurance Dashboard</p>
        <h1>Gravity Insurance</h1>
        <p class="subheading">Customer quote pages</p>
    </header>
    <button type="button" class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="topMenu">
        <span class="menu-toggle-icon">&#9776;</span> Menu
    </button>
    <nav class="top-menu" id="topMenu">
        <a class="{{NAV_HOME_CLASS}}" href="/">Home</a>
        <a class="{{NAV_LEADS_CLASS}}" href="/leads">Leads</a>
        <a class="{{NAV_ACTIVE_CLASS}}" href="/active-clients">Active Client</a>
        <a class="{{NAV_EXPIRY_CLASS}}" href="/expiry-alerts">Expiry Alerts</a>
        <a class="{{NAV_SENDQUOTE_CLASS}}" href="/send-quote">Send Quote</a>
        {{NAV_USERS_LINK}}
        {{NAV_AUTH_LINK}}
    </nav>

    <div class="page-content">
        {{PAGE_CONTENT}}
    </div>
    </div>
    <script>
        const toggleButton = document.getElementById("toggleAddForm");
        const form = document.getElementById("addCustomerForm");

        if (toggleButton && form) {
            toggleButton.addEventListener("click", function () {
                form.classList.toggle("is-hidden");
            });
        }

        // Mobile nav: toggle the menu list open/closed.
        const menuToggle = document.getElementById("menuToggle");
        const topMenu = document.getElementById("topMenu");

        if (menuToggle && topMenu) {
            menuToggle.addEventListener("click", function () {
                const isOpen = topMenu.classList.toggle("is-open");
                menuToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
            });
        }

        // Mobile layout: copy each column header onto its cells so CSS can
        // stack rows into labelled cards on small screens.
        function applyStackedLabels(table) {
            const headers = Array.from(table.querySelectorAll("thead th")).map(function (th) {
                return (th.textContent || th.getAttribute("aria-label") || "").trim();
            });
            if (!headers.length) {
                return;
            }
            table.classList.add("stacked");
            table.querySelectorAll("tbody tr").forEach(function (row) {
                row.querySelectorAll("td").forEach(function (cell, index) {
                    const label = cell.hasAttribute("colspan") ? "" : (headers[index] || "");
                    cell.setAttribute("data-label", label);
                });
            });
        }

        document.querySelectorAll("table").forEach(function (table) {
            applyStackedLabels(table);
            const body = table.querySelector("tbody");
            if (body) {
                new MutationObserver(function () {
                    applyStackedLabels(table);
                }).observe(body, { childList: true });
            }
        });
    </script>
</body>
</html>
